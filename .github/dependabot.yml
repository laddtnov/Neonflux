# Keeps the pinned action SHAs in .github/workflows/ from going stale.
#
# github-actions is the only ecosystem here on purpose: this project has zero
# npm dependencies and no lockfile, so there is nothing for an npm entry to
# update and `npm ci` would fail anyway.
#
# Dependabot rewrites a pinned `uses:` to the new SHA and updates the version
# comment beside it, which is what makes a commit pin maintainable rather than
# a thing nobody dares touch. Review those PRs like any other: read what
# changed upstream, do not merge on the version bump alone.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
